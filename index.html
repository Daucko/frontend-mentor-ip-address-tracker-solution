<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | IP Address Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">IP Address Tracker</h1>

      <form class="search" id="search-form" novalidate>
        <label class="sr-only" for="query"
          >Search for any IP address or domain</label
        >
        <input
          type="text"
          id="query"
          placeholder="Search for any IP address or domain"
          autocomplete="off"
        />
        <button type="submit" aria-label="Search">
          <img src="images/icon-arrow.svg" alt="" />
        </button>
      </form>
      <p class="error" id="error" role="alert"></p>

      <section class="info" aria-live="polite">
        <div class="info__item">
          <h2>IP Address</h2>
          <p id="ip">–</p>
        </div>
        <div class="info__item">
          <h2>Location</h2>
          <p id="location">–</p>
        </div>
        <div class="info__item">
          <h2>Timezone</h2>
          <p id="timezone">–</p>
        </div>
        <div class="info__item">
          <h2>ISP</h2>
          <p id="isp">–</p>
        </div>
      </section>
    </header>

    <div id="map" aria-label="Map showing the IP address location"></div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://daucode-portfolio.vercel.app/" target="_blank"
        >Dev Dauddy</a
      >.
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
